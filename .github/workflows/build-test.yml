---
# Процесс сборки тестовой версии сайта и выгрузки его на хостинг по FTP
name: Build testing site and deploy to FTP

# Запуск workflow при обновлении ветки develop
on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest

    steps:
      # Получение кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Обновление списка доступных пакетов
      - name: Update APT index
        run: sudo apt-get update

      # Установка пакетов, необходимых для сборки сайта
      - name: Install make, graphviz and JRE
        run: sudo apt-get install -y --no-install-recommends make graphviz default-jre

      # Установка Python (фиксируем версию, чтобы сборка была стабильной)
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Обновление PIP и установка зависимостей (всё через один и тот же python)
      - name: Update PIP and install requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -c "import pkg_resources; print('pkg_resources OK')"

      # Сборка проекта в формате html
      - name: Build Sphinx project
        run: |
          python -m sphinx --version
          make html

      # Отправка метрик этой сборки в DocMonitor
      - name: Send build metrics to DocMonitor
        if: always()
        env:
          DOCMONITOR_URL: "https://irradiatingly-unsoothed-adah.ngrok-free.dev"
          DOCMONITOR_PROJECT: "web3"
          DOCMONITOR_BRANCH: ${{ github.ref_name }}
          DOCMONITOR_COMMIT: ${{ github.sha }}
        run: |
          chmod +x .github/docmonitor/dmci-lite.sh
          .github/docmonitor/dmci-lite.sh "noop"

