name: Build testing site and deploy to FTP + DocMonitor

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest

    env:
      DOCMONITOR_URL: ${{ secrets.DOCMONITOR_URL }}
      DOCMONITOR_PROJECT: techwri/web3
      DOCMONITOR_REPO_URL: https://github.com/techwri/web3
      DOCMONITOR_BRANCH: ${{ github.ref_name }}
      DOCMONITOR_COMMIT: ${{ github.sha }}
      DOCMONITOR_SYSTEM: Sphinx

    steps:
      # Получение кода
      - name: Checkout code
        uses: actions/checkout@v4

      # (опционально) обновить APT
      - name: Update APT index
        run: sudo apt-get update

      # Пакеты для сборки Sphinx
      - name: Install make, graphviz and JRE
        run: sudo apt-get install make graphviz default-jre --yes --no-install-recommends

      # Python
      - name: Install Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Python deps
      - name: Update PIP and install requirements
        run: |
          python -m pip install --upgrade pip
          pip3 install -r requirements.txt || true
          # На случай, если в requirements нет sphinx:
          pip3 install sphinx || true

      # Выполняем сборку через агент DocMonitor — он соберёт stdout/stderr и отправит статус/логи
      - name: Send build logs to DocMonitor (make html)
        run: |
          chmod +x .github/docmonitor/dmci-lite.sh
          .github/docmonitor/dmci-lite.sh 'make html'

      # (опционально) rstcheck → DocMonitor
      # - name: rstcheck → DocMonitor
      #   run: |
      #     pip3 install rstcheck || true
      #     .github/docmonitor/dmci-lite.sh 'rstcheck -r . || true'

