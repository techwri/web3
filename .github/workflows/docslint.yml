name: DocMonitor Metrics

on:
  push:
    branches: [ develop, main ]
  pull_request:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install sphinx || true

      - name: Run DocsLint Lite Agent
        env:
          DOCSLINT_URL: ${{ secrets.DOCSLINT_URL }}
        run: |
          if [ -z "${DOCSLINT_URL:-}" ]; then
            echo "DOCSLINT_URL is empty or secrets are unavailable (e.g., PR from fork). Skipping."
            exit 0
          fi
          chmod +x .github/docslint/dmci-lite.sh
          .github/docslint/dmci-lite.sh