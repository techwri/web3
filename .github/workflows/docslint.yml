name: DocMonitor Metrics

on:
  push:
    branches: [ develop, main ]
  pull_request:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install sphinx || true

      - name: Run DocsLint Lite Agent
        if: ${{ secrets.DOCSLINT_URL != '' }}
        env:
          DOCSLINT_URL: ${{ secrets.DOCSLINT_URL }}
        run: |
          chmod +x .github/docslint/dmci-lite.sh
          .github/docslint/dmci-lite.sh
